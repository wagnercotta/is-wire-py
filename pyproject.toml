[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "is_wire"
version = "2.0.0"
description = "Pub/Sub middleware for the IS architecture (Python implementation)."
readme = "README.md"

license = "MIT"

authors = [
    {name = "labvisio", email = "labvisio.ufes@gmail.com"}
]

requires-python = ">=3.9"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "colorlog>=6.10.0",
    "amqp>=5.3.0",
    "protobuf>=5.0.0",
    "prometheus-client>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/labvisio/is-wire-py"
Repository = "https://github.com/labvisio/is-wire-py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require RabbitMQ connection",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/is_wire"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]